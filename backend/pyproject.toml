[project]
name = "walletly-backend"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "apscheduler>=3.11.3",
    "asyncpg>=0.32.0",
    "fastapi>=0.162.0",
    "httpx>=0.28.1",
    "mlflow-skinny>=3.18.0",
    "numpy>=2.5.4",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pwdlib[argon2]>=0.3.1",
    "pydantic-settings>=2.16.1",
    "pydantic[email]>=2.14.1",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.33",
    "redis>=8.1.0",
    "scikit-learn>=1.9.1",
    "sqlalchemy[asyncio]>=2.1.6",
    "torch>=2.15.0",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "fakeredis>=2.40.0",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
# Корень backend/ в sys.path — чтобы в тестах работал `import app`
pythonpath = ["."]
testpaths = ["tests"]

# На Linux (сервер и Docker) ставим сборку PyTorch только для CPU: она в разы меньше
[tool.uv.sources]
torch = [{ index = "pytorch-cpu", marker = "sys_platform == 'linux'" }]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true
