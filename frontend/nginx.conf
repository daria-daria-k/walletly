# Лимиты считаются по адресу клиента. Числа заданы с запасом: страница приложения
# делает сразу много запросов, а за одним адресом может быть вся семья
limit_req_zone $binary_remote_addr zone=walletly_auth:10m rate=30r/m;
limit_req_zone $binary_remote_addr zone=walletly_upload:10m rate=20r/m;
limit_req_zone $binary_remote_addr zone=walletly_api:10m rate=30r/s;
limit_conn_zone $binary_remote_addr zone=walletly_conn:10m;

server {
    # Образ работает не от root, а такой процесс не может занять порт ниже 1024
    listen 8080;
    root /usr/share/nginx/html;
    # Разрешаем имя API во время запроса, а не при старте nginx. Благодаря этому
    # статический фронтенд можно запускать отдельно от серверных контейнеров.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_backend api:8000;

    # Не сообщаем атакующему точную версию
    server_tokens off;

    # Чуть больше лимита импорта в API (5 МБ): ошибку о размере файла должен дать бэкенд
    client_max_body_size 6m;
    # Медленная отправка запроса не должна держать соединение: так работает Slowloris
    client_header_timeout 10s;
    client_body_timeout 15s;

    # Перед nginx стоит Caddy, поэтому без этих строк все клиенты выглядели бы одним
    # адресом и делили один лимит. Доверяем заголовку только от внутренних сетей Docker
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    limit_req_status 429;
    limit_conn_status 429;
    limit_conn walletly_conn 50;
    error_page 429 = @too_many_requests;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # JSON, а не страница nginx: интерфейс показывает пользователю текст из поля detail
    location @too_many_requests {
        default_type "application/json; charset=utf-8";
        return 429 '{"detail":"Слишком много запросов. Попробуйте позже"}';
    }

    # В именах файлов сборки есть хеш: их можно кэшировать надолго
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Самые дорогие запросы: хеш пароля или отправка письма
    location ~ ^/api/auth/(login|register|forgot-password|reset-password|verify-email|resend-verification)$ {
        limit_req zone=walletly_auth burst=10 nodelay;
        proxy_pass http://$api_backend;
    }

    location ~ ^/api/ledgers/[0-9]+/import(/statement)?$ {
        limit_req zone=walletly_upload burst=5 nodelay;
        proxy_pass http://$api_backend;
    }

    location /api/ {
        limit_req zone=walletly_api burst=100 nodelay;
        proxy_pass http://$api_backend;
    }

    # Иначе браузер держал бы старый service worker и обновление приложения не доходило бы
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Адреса вроде /transactions — это маршруты React, файлов с такими именами нет
    location / {
        try_files $uri /index.html;
    }
}
