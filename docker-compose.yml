services:
  db:
    image: postgres:17-alpine
    container_name: walletly-db
    restart: unless-stopped
    # Лимиты памяти: сбой одного сервиса не должен останавливать весь сервер
    mem_limit: 512m
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # 127.0.0.1: порт доступен только с этого компьютера. Docker обходит правила фаервола,
      # поэтому без адреса база на сервере оказалась бы открыта всему интернету
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: walletly-redis
    restart: unless-stopped
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  api:
    build: ./backend
    container_name: walletly-api
    restart: unless-stopped
    # Само API около 400 МБ, 4 хеша по 64 МБ и 2 разбора файлов по 640 МБ
    mem_limit: 2g
    env_file: .env
    environment:
      # Внутри сети Compose база доступна по имени сервиса и на своём порту
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    container_name: walletly-worker
    restart: unless-stopped
    mem_limit: 1500m
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
      MLFLOW_TRACKING_URI: ${MLFLOW_TRACKING_URI:-}
    command: ["python", "-m", "app.worker"]
    depends_on:
      - api

  bot:
    build: ./backend
    container_name: walletly-bot
    restart: unless-stopped
    mem_limit: 768m
    env_file: .env
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: "5432"
      REDIS_URL: redis://redis:6379/0
    command: ["python", "-m", "app.bot"]
    depends_on:
      - api

  web:
    build: ./frontend
    container_name: walletly-web
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    depends_on:
      - api

  # Необязательные сервисы включаются профилями: --profile ml, --profile monitoring
  mlflow:
    image: ghcr.io/mlflow/mlflow:v3.18.0
    container_name: walletly-mlflow
    profiles: [ml]
    restart: unless-stopped
    mem_limit: 768m
    command: ["mlflow", "server", "--host", "0.0.0.0", "--port", "5000", "--backend-store-uri", "sqlite:////mlflow/mlflow.db", "--default-artifact-root", "/mlflow/artifacts", "--allowed-hosts", "mlflow:5000,localhost:5001,127.0.0.1:5001"]
    ports:
      - "127.0.0.1:5001:5000"
    volumes:
      - mlflow:/mlflow

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: walletly-prometheus
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 512m
    volumes:
      - ./deploy/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus:/prometheus

  grafana:
    image: grafana/grafana:12.1.0
    container_name: walletly-grafana
    profiles: [monitoring]
    restart: unless-stopped
    mem_limit: 384m
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-change-me}
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./deploy/grafana-datasource.yml:/etc/grafana/provisioning/datasources/datasource.yml:ro
      - grafana:/var/lib/grafana

volumes:
  pgdata:
  mlflow:
  prometheus:
  grafana:
