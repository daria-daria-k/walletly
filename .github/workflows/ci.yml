name: CI

on:
  push:
    branches: [main, mvp]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: walletly
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: walletly
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U walletly"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      POSTGRES_USER: walletly
      POSTGRES_PASSWORD: ci-password
      POSTGRES_DB: walletly
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      JWT_SECRET: ci-only-secret-not-used-anywhere-else
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --frozen
      - name: Миграции применяются и совпадают с моделями
        run: |
          uv run alembic upgrade head
          uv run alembic check
      - run: uv run pytest -q

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
