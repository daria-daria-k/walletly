name: Deploy

# Только ручной запуск: выкатка на сервер должна быть осознанным решением
on:
  workflow_dispatch:

# Шаг работает только по SSH: права на репозиторий ему не нужны
permissions: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Обновить приложение на сервере
        # Закреплено по хешу: этот шаг получает SSH-ключ сервера, а тег автор может переставить
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ${{ secrets.DEPLOY_PATH }}
            git pull --ff-only
            docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
            sleep 15
            docker exec walletly-web wget -qO- http://api:8000/api/health
